[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cisa-kev-analysis"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=2,<3",
  "plotly>=6,<7",
  "Jinja2>=3.1,<4",
  "PyYAML>=6,<7",
  "Pillow>=10,<13",
  "scikit-learn>=1.5,<2",
  "PyQt6>=6.8,<6.9",
  "PyQt6-WebEngine>=6.8,<6.9",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
